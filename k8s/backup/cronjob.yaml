# Nightly pg_dump from local PG → restore to Neon
# Schedule: every day at 03:00 UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coursebench-backup-neon
  namespace: coursebench
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 min timeout
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:17-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: coursebench-pg-app-credentials
                      key: password
                - name: NEON_URL
                  valueFrom:
                    secretKeyRef:
                      name: coursebench-secrets
                      key: NEON_DATABASE_URL
              command:
                - /bin/sh
                - -e
                - -c
                - |
                  echo "[$(date -Iseconds)] Starting backup to Neon..."

                  # Dump from local PG using PGPASSWORD env var (no password in URL)
                  pg_dump -h coursebench-pg-rw -U app -d coursebench \
                    --format=custom \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    -f /tmp/backup.dump

                  DUMP_SIZE=$(du -h /tmp/backup.dump | cut -f1)
                  echo "[$(date -Iseconds)] Dump complete: $DUMP_SIZE"

                  # Wipe Neon schema and restore fresh
                  psql "$NEON_URL" -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public; GRANT ALL ON SCHEMA public TO PUBLIC;"
                  pg_restore \
                    --dbname="$NEON_URL" \
                    --no-owner \
                    --no-privileges \
                    /tmp/backup.dump

                  rm -f /tmp/backup.dump
                  echo "[$(date -Iseconds)] Backup to Neon complete."
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
