# Nightly pg_dump from local PG → restore to Neon
# Schedule: every day at 03:00 UTC
apiVersion: batch/v1
kind: CronJob
metadata:
  name: coursebench-backup-neon
  namespace: coursebench
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800  # 30 min timeout
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: reg.geekpie.club/proxy/postgres:16-alpine
              env:
                - name: SOURCE_URL
                  # CloudNativePG primary service
                  value: "postgresql://app:$(PG_PASSWORD)@coursebench-pg-rw:5432/coursebench"
                - name: PG_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: coursebench-pg-app-credentials
                      key: password
                - name: NEON_URL
                  valueFrom:
                    secretKeyRef:
                      name: coursebench-secrets
                      key: NEON_DATABASE_URL
              command:
                - /bin/sh
                - -e
                - -c
                - |
                  export SOURCE_URL="postgresql://app:${PG_PASSWORD}@coursebench-pg-rw:5432/coursebench"
                  echo "[$(date -Iseconds)] Starting backup to Neon..."

                  # Dump from local PG (custom format, no owner/privileges)
                  pg_dump "$SOURCE_URL" \
                    --format=custom \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    -f /tmp/backup.dump

                  DUMP_SIZE=$(du -h /tmp/backup.dump | cut -f1)
                  echo "[$(date -Iseconds)] Dump complete: $DUMP_SIZE"

                  # Restore to Neon (--clean drops+recreates objects, --if-exists avoids errors)
                  pg_restore \
                    --dbname="$NEON_URL" \
                    --no-owner \
                    --no-privileges \
                    --clean \
                    --if-exists \
                    --single-transaction \
                    /tmp/backup.dump || true
                  # pg_restore exits non-zero on warnings (e.g. "role does not exist"),
                  # so we || true and rely on verification below.

                  # Verify: compare row counts for key tables
                  echo "[$(date -Iseconds)] Verifying..."
                  for TABLE in users courses comments teachers; do
                    SRC_COUNT=$(psql "$SOURCE_URL" -tAc "SELECT count(*) FROM $TABLE")
                    DST_COUNT=$(psql "$NEON_URL" -tAc "SELECT count(*) FROM $TABLE")
                    echo "  $TABLE: source=$SRC_COUNT neon=$DST_COUNT"
                    if [ "$SRC_COUNT" != "$DST_COUNT" ]; then
                      echo "  WARNING: count mismatch for $TABLE!"
                    fi
                  done

                  rm -f /tmp/backup.dump
                  echo "[$(date -Iseconds)] Backup to Neon complete."
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
