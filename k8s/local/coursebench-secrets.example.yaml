apiVersion: v1
kind: Secret
metadata:
  name: coursebench-secrets
  namespace: coursebench
type: Opaque
stringData:
  DATABASE_URL: "postgresql://app:CHANGE_ME@coursebench-pg-rw:5432/coursebench"
  REDIS_URL: "redis://coursebench-redis:6379"

  MINIO_ENDPOINT: "coursebench-minio:9000"
  MINIO_BUCKET: "coursebench"
  MINIO_ACCESS_KEY: "minioadmin"
  MINIO_SECRET_KEY: "CHANGE_ME_MINIO_SECRET"
  MINIO_USE_SSL: "false"

  SESSION_SECRET: "CHANGE_ME_AT_LEAST_32_CHARS_LONG_SECRET"

  NEXT_PUBLIC_TURNSTILE_SITE_KEY: "CHANGE_ME"
  TURNSTILE_SECRET_KEY: "CHANGE_ME"

  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "465"
  SMTP_USERNAME: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  SMTP_FROM: "CHANGE_ME@example.com"
  SMTP_FROM_NAME: "CourseBench"

  NEXT_PUBLIC_SERVER_URL: "https://coursebench.org"

  NEON_DATABASE_URL: "postgresql://neondb_owner:CHANGE_ME@ep-xxx.us-east-1.aws.neon.tech/neondb?sslmode=require"
