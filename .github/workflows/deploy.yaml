name: Build & Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - 'k8s/app/deployment.yaml'

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            DATABASE_URL=postgresql://build:build@localhost/build
            REDIS_URL=redis://localhost:6379
            NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update deployment image tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
          IMAGE_WITH_TAG="${{ env.IMAGE }}:${SHORT_SHA}"
          # lowercase the image path (ghcr.io requires lowercase)
          IMAGE_WITH_TAG=$(echo "$IMAGE_WITH_TAG" | tr '[:upper:]' '[:lower:]')
          sed -i "s|image: .*|image: ${IMAGE_WITH_TAG}|" k8s/app/deployment.yaml
          echo "Updated image to: ${IMAGE_WITH_TAG}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app/deployment.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: update app image to ${{ github.sha }} [skip ci]"
          git push
